name: Build Mobile Apps (Android APK & iOS IPA)

on:
  workflow_dispatch:

env:
  NAME: "BuffCalendar"

jobs:
  build-all:
    runs-on: macos-14
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pack Unsigned iOS IPA
        run: |
          mkdir -p ipa_out/Payload
          cp game.pck ipa_out/Payload/${{ env.NAME }}.pck
          cd ipa_out
          zip -r ../${{ env.NAME }}.ipa Payload

      - name: Pack Android APK
        run: |
          # Собираем правильную структуру папок для Android без скачивания шаблонов
          mkdir -p apk_out/assets
          cp game.pck apk_out/assets/game.pck
          cd apk_out
          zip -r ../${{ env.NAME }}.apk assets



