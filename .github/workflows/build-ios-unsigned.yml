name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:

env:
  NAME: "BuffCalendar"

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack Unsigned IPA
        run: |
          mkdir -p ipa_out/Payload
          cp game.pck ipa_out/Payload/${{ env.NAME }}.pck
          cd ipa_out
          zip -r ../${{ env.NAME }}.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-Unsigned-IPA
          path: ${{ env.NAME }}.ipa
