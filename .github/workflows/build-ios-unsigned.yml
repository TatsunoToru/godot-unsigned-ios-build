name: Build Mobile Apps (Android APK & iOS IPA)

on:
  workflow_dispatch:

env:
  NAME: "BuffCalendar"

jobs:
  build-all:
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pack Unsigned iOS IPA
        run: |
          mkdir -p ipa_out/Payload
          cp game.pck ipa_out/Payload/${{ env.NAME }}.pck
          cd ipa_out
          zip -r ../${{ env.NAME }}.ipa Payload

      - name: Download Android Template & Pack APK
        run: |
          curl -LO https://github.com
          unzip Godot_v4.3-stable_export_templates.tpz
          cp templates/android_release.apk BuffCalendar.apk
          zip -u BuffCalendar.apk game.pck

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuffCalendar-iOS-IPA
          path: BuffCalendar.ipa

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuffCalendar-Android-APK
          path: BuffCalendar.apk

