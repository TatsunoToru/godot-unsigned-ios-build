name: Build Mobile Apps (Android APK & iOS IPA)

on:
  workflow_dispatch:

env:
  NAME: "BuffCalendar"

jobs:
  build-all:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pack Unsigned iOS IPA
        run: |
          mkdir -p ipa_out/Payload
          cp BuffCalendar_iOS.pck ipa_out/Payload/${{ env.NAME }}.pck
          cd ipa_out
          zip -r ../${{ env.NAME }}.ipa Payload
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-ios-ipa
          path: ${{ env.NAME }}.ipa
